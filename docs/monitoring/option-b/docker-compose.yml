# Satelink Monitoring — Embedded Grafana (Option B) — Self-hosted LGTM stack
#
# DESIGN ARTIFACT — DO NOT `docker compose up` UNTIL ARCHITECTURE REVIEW APPROVED.
# Target host: single Hetzner box (CPX41+). Object storage (S3/R2) for Loki+Tempo.
# Secrets come from a sibling `.env` (see 02-deployment-railway-hetzner.md) — never
# commit real values. Stack is bound to a private docker network; only Grafana is
# reachable, and only via the Next.js embed proxy / tailnet.

name: satelink-monitoring

networks:
  lgtm:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  alertmanager-data:

services:
  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    networks: [lgtm]
    ports:
      - "127.0.0.1:3000:3000"   # localhost only; reached via embed proxy / tailnet
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}              # e.g. https://app.satelink.network/api/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Embed: allow iframe ONLY from the Satelink web origin via the proxy.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "none"
      GF_SECURITY_COOKIE_SECURE: "true"
      # Service-account JWT auth for the BFF (scoped tokens minted per request).
      GF_FEATURE_TOGGLES_ENABLE: "externalServiceAccounts"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    networks: [lgtm]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage   # metric→trace exemplars
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    networks: [lgtm]
    command: -config.file=/etc/loki/loki.yml
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_LOKI: ${S3_BUCKET_LOKI}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    networks: [lgtm]
    command: -config.file=/etc/tempo/tempo.yml
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_TEMPO: ${S3_BUCKET_TEMPO}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    networks: [lgtm]
    ports:
      - "4317:4317"   # OTLP gRPC  (traces in from apps/api)
      - "4318:4318"   # OTLP HTTP
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      PROM_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
      TEMPO_OTLP_ENDPOINT: tempo:4317
      API_SCRAPE_TARGET: ${API_SCRAPE_TARGET}       # rpc.satelink.network
      API_METRICS_TOKEN: ${API_METRICS_TOKEN}        # bearer for /metrics if gated
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on: [prometheus, loki, tempo]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    networks: [lgtm]
    command: --config.file=/etc/alertmanager/alertmanager.yml
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY}
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    networks: [lgtm]
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN}   # postgres://...:5432/db?sslmode=require

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    networks: [lgtm]
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_ADDR}
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD}
