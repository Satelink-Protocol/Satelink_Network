# DESIGN ARTIFACT — Alertmanager routing. P1 → PagerDuty + Discord; everything
# else → Discord by team channel. Per-persona alerts (node operator, enterprise)
# are routed to tenant-specific webhooks, never broadcast cross-tenant.

global:
  resolve_timeout: 5m

route:
  receiver: discord-platform
  group_by: [alertname, severity, team]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="P1"]
      receiver: pagerduty-critical
      continue: true
    - matchers: [team="revenue"]
      receiver: discord-revenue
    - matchers: [team="security"]
      receiver: discord-security

receivers:
  - name: discord-platform
    discord_configs:
      - webhook_url: ${DISCORD_WEBHOOK_URL}
  - name: discord-revenue
    discord_configs:
      - webhook_url: ${DISCORD_WEBHOOK_URL}
  - name: discord-security
    discord_configs:
      - webhook_url: ${DISCORD_WEBHOOK_URL}
  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}

inhibit_rules:
  - source_matchers: [severity="P1"]
    target_matchers: [severity="P2"]
    equal: [alertname]
