# DESIGN ARTIFACT — Loki single-binary config, chunks offloaded to S3-compatible
# object storage (Hetzner Object Storage or Cloudflare R2). Labels kept LOW
# cardinality: {service, route_class, level, env}. High-cardinality identifiers
# (request_id, trace_id, api_key_hash, tx_hash, wallet, node_id) are log FIELDS,
# extracted at query time — never stream labels.

auth_enabled: false   # multi-tenant isolation enforced at the embed proxy, not here

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
  aws:
    s3: ${S3_ENDPOINT}
    bucketnames: ${S3_BUCKET_LOKI}
    access_key_id: ${S3_ACCESS_KEY}
    secret_access_key: ${S3_SECRET_KEY}
    s3forcepathstyle: true

limits_config:
  retention_period: 720h          # 30d
  max_label_names_per_series: 12
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  # Guardrail: cap stream cardinality so a label explosion can't blow up cost.
  max_streams_per_user: 5000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  alertmanager_url: http://alertmanager:9093
