# Generated by apps/api/src/trading_agent/observability/alerts.mjs — do not edit by hand.
groups:
  - name: satelink-trading
    rules:
      - alert: TradingBrokerUnreachable
        expr: "min by (venue) (trading_broker_up) < 1"
        for: 120s
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Broker {{ $labels.venue }} unreachable for 2 minutes"
      - alert: TradingMarketDataStale
        expr: "max by (venue) (trading_market_data_age_seconds) > 60"
        for: 300s
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Market data from {{ $labels.venue }} older than 60s for 5 minutes"
      - alert: TradingUnknownOrderAging
        expr: "trading_orders_unknown_oldest_age_seconds > 300"
        for: 0s
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "An order has been UNKNOWN for over 5 minutes"
      - alert: TradingUnknownOrderStuck
        expr: "trading_orders_unknown_oldest_age_seconds > 1800"
        for: 0s
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "An order has been UNKNOWN for over 30 minutes — manual review"
      - alert: TradingReconcileErrors
        expr: "increase(trading_reconcile_errors_total[10m]) > 5"
        for: 0s
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "OMS reconciler failing lookups"
      - alert: TradingPortfolioMismatch
        expr: "increase(trading_portfolio_reconciliation_mismatch_total[15m]) > 0"
        for: 0s
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "Positions disagree with the broker"
      - alert: TradingGlobalKillSwitch
        expr: "trading_kill_switches_engaged{scope=\"global\"} > 0"
        for: 0s
        labels:
          severity: critical
          team: trading
        annotations:
          summary: "The global kill switch is engaged"
      - alert: TradingKillSwitchEngaged
        expr: "sum(trading_kill_switches_engaged) > 0"
        for: 0s
        labels:
          severity: info
          team: trading
        annotations:
          summary: "One or more kill switches are engaged"
      - alert: TradingRevenueVariance
        expr: "max by (source) (trading_revenue_variance_minor) > 0"
        for: 3600s
        labels:
          severity: warning
          team: trading
        annotations:
          summary: "Settled and booked amounts disagree for {{ $labels.source }} for an hour"
