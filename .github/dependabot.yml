version: 2
updates:
  # This repo is an npm workspaces monorepo (see root package.json "workspaces").
  # The ONLY lockfile npm/CI reads is the root package-lock.json — never add or
  # commit a nested apps/*/package-lock.json, or Dependabot will target it
  # instead of the root lockfile and every PR it opens will fail `npm ci`.
  #
  # Policy (2026-09-16 consolidation): group minor+patch updates into one weekly
  # PR per app; NEVER auto-open a major-version PR — majors are a manual,
  # reviewed decision (see audit/PR_DECISIONS_2026-09-16.md and the "Dependency
  # major upgrades" tracking issue). A critical security fix that happens to be
  # a major bump still needs a human to act on it out-of-band (as this session
  # did for the Next.js RCE, PR #375, which was fortunately a same-major patch)
  # — Dependabot will not silently open one.
  #
  # INCIDENT (2026-09-21, #394): the wildcard `update-types: semver-major`
  # rule below did NOT stop eslint 9->10 from reopening. Root cause traced:
  # the FIRST eslint-major PR (#381) predated this policy, then got manually
  # merged by an admin a day AFTER the policy landed (merge is a human action
  # `ignore` cannot block — it only suppresses Dependabot from OPENING a new
  # PR) and was reverted for an unrelated lockfile-desync reason (#383, same
  # incident as #379). Because it was closed via merge+revert rather than an
  # explicit `@dependabot ignore this major version` comment, Dependabot's
  # own per-dependency ignore-condition bookkeeping never recorded a
  # rejection for 10.x, and its next weekly scan re-proposed the identical
  # bump as #394 — the wildcard config rule evidently did not re-suppress it.
  # Fix: an explicit, dependency-scoped `versions` ignore below is a second,
  # independent mechanism (not update-type classification) as a backstop for
  # every dependency this has actually happened to. Extend this list any time
  # a major reopens despite the wildcard rule.
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Explicit backstop (see INCIDENT note above) — belt-and-suspenders
      # beyond the wildcard rule, which alone did not prevent #394.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
    open-pull-requests-limit: 3

  # Backend dependencies - weekly, grouped. x402/@coinbase packages are the
  # money-path (version skew here has caused real production outages — see
  # merged PRs #362, #371) and are NEVER auto-bumped, minor or major.
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      api-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@x402/*"
      - dependency-name: "@coinbase/x402"
    open-pull-requests-limit: 2

  # GitHub Actions - monthly only
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
