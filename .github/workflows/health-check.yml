name: health-check

# External uptime check for api.satelink.network/health, run on GitHub's infra —
# OUTSIDE the Railway + Postgres failure domain. The reconciler guardrails cannot
# alarm on a DB-down / edge-404 outage because they run inside the reconciler,
# which needs the DB (see docs/ops/external-monitoring.md). This is the outer layer.
#
# On failure it opens (and de-dups) a GitHub issue, and fails the run so GitHub
# emails the workflow author. On recovery it closes the issue.
#
# Caveats: GitHub's scheduled cron is best-effort and can lag 5-15 min under load,
# and scheduled workflows are auto-disabled after 60 days of repo inactivity. For a
# tighter guarantee, a dedicated uptime service (UptimeRobot) is still preferable.
# This activates only once merged to the default branch.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  x402-challenge:
    # T-04 (2026-09-15): the anonymous /rpc 402 must stay a payable x402 challenge.
    # From 2026-08-20 to 2026-09-15 it silently degraded to a non-payable legacy
    # 402 (@x402/* version skew) while /health stayed green and CI passed.
    #
    # Target: repo variable X402_PROBE_URL, default the public API. Cloudflare
    # (Free plan) has blocked GitHub runner IPs on api.satelink.network with a 403
    # (see the probe job below). A blocked probe FAILS as "probe blocked" — it is
    # never treated as healthy. Point X402_PROBE_URL at a Cloudflare-free
    # Satelink-api domain (e.g. a Railway-generated *.up.railway.app) to make
    # this check conclusive.
    runs-on: ubuntu-latest
    steps:
      - name: Probe the anonymous 402 shape (3 attempts)
        id: probe
        env:
          PROBE_URL: ${{ vars.X402_PROBE_URL || 'https://api.satelink.network/rpc/polygon' }}
        run: |
          ok=false
          reason=unknown
          for attempt in 1 2 3; do
            headers="$(mktemp)"; body="$(mktemp)"
            code="$(curl -sS -m 20 -o "$body" -D "$headers" -w '%{http_code}' -X POST "$PROBE_URL" \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' || echo 000)"
            if [ "$code" = "403" ] && grep -qi '^server: cloudflare' "$headers"; then
              reason="probe blocked by Cloudflare (HTTP 403) — set X402_PROBE_URL"
            elif [ "$code" != "402" ]; then
              reason="expected HTTP 402, got $code"
            elif ! grep -qi '^payment-required:' "$headers"; then
              reason="402 missing PAYMENT-REQUIRED header (non-payable legacy 402)"
            elif ! grep -q '"accepts"' "$body" || ! grep -q '"x402Version"' "$body"; then
              reason="402 body missing accepts/x402Version"
            else
              ok=true; reason="payable x402 challenge"; break
            fi
            echo "attempt $attempt: $reason"
            sleep 10
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Result: ok=$ok ($reason)"

      - name: Open / update / close the x402 incident issue
        if: always()
        uses: actions/github-script@v9
        env:
          OK: ${{ steps.probe.outputs.ok }}
          REASON: ${{ steps.probe.outputs.reason }}
        with:
          script: |
            const ok = process.env.OK === 'true';
            const reason = process.env.REASON || 'probe did not run';
            const marker = '<!-- satelink-x402-challenge-monitor -->';
            const label = 'health-incident';
            const { owner, repo } = context.repo;
            const now = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 20,
            });
            const existing = open.data.find((i) => (i.body || '').includes(marker));

            if (!ok) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Still failing at ${now}: ${reason}. ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({
                  owner, repo,
                  title: '🔴 x402 402 challenge is not payable',
                  labels: [label],
                  body: `${marker}\nx402 challenge check failed at ${now}.\n\n`
                      + `- Reason: ${reason}\n`
                      + `- Run: ${runUrl}\n\n`
                      + `Expected: anonymous POST /rpc/polygon → HTTP 402 with a PAYMENT-REQUIRED header `
                      + `and a body containing "accepts" and "x402Version". This issue auto-closes on recovery.`,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `✅ Recovered at ${now}. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed',
              });
            }

      - name: Fail the run if the challenge is not payable
        if: steps.probe.outputs.ok != 'true'
        run: |
          echo "::error title=x402 challenge::${{ steps.probe.outputs.reason }}"
          exit 1

  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /health (3 attempts to avoid flapping on a single blip)
        id: probe
        run: |
          # Probe the reconciler's Cloudflare-FREE Railway domain, not
          # api.satelink.network: Cloudflare (Free plan) blocks GitHub Actions'
          # datacenter IPs with a 403, so the edge-fronted API is unreachable from
          # here. The reconciler's /readyz runs `SELECT 1` (DB-aware) and shares the
          # DB failure domain, so this catches the DB/compute-limit outage class.
          url="https://satelink-reconciler-production.up.railway.app/readyz"
          healthy=false
          code=000
          for attempt in 1 2 3; do
            resp="$(curl -sS -m 15 -w $'\n%{http_code}' "$url" || true)"
            code="$(printf '%s' "$resp" | tail -n1)"
            payload="$(printf '%s' "$resp" | sed '$d')"
            # Healthy = HTTP 200 AND the DB reports ok (503 "db":"down" if the DB is
            # unreachable — the 2026-08-28 outage signature).
            if [ "$code" = "200" ] && printf '%s' "$payload" | grep -q '"db":"ok"'; then
              healthy=true
              break
            fi
            echo "attempt $attempt: http=$code (not healthy), retrying..."
            sleep 10
          done
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Result: healthy=$healthy http=$code"

      - name: Open / update / close the incident issue
        if: always()
        uses: actions/github-script@v9
        env:
          HEALTHY: ${{ steps.probe.outputs.healthy }}
          CODE: ${{ steps.probe.outputs.code }}
        with:
          script: |
            const healthy = process.env.HEALTHY === 'true';
            const code = process.env.CODE || '000';
            const marker = '<!-- satelink-health-monitor -->';
            const label = 'health-incident';
            const { owner, repo } = context.repo;
            const now = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 20,
            });
            const existing = open.data.find((i) => (i.body || '').includes(marker));

            if (!healthy) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Still DOWN at ${now} (HTTP ${code}). ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({
                  owner, repo,
                  title: '🔴 Satelink /health is DOWN',
                  labels: [label],
                  body: `${marker}\nExternal health check failed at ${now}.\n\n`
                      + `- URL: https://api.satelink.network/health\n`
                      + `- HTTP: ${code}\n`
                      + `- Run: ${runUrl}\n\n`
                      + `Likely causes: Railway compute-limit kill switch, Postgres offline, or a failed deploy `
                      + `(see docs/ops/external-monitoring.md). This issue auto-closes on recovery.`,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `✅ Recovered at ${now} (HTTP ${code}). Auto-closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed',
              });
            }

      - name: Fail the run if unhealthy (surfaces the red X + GitHub notification)
        if: steps.probe.outputs.healthy != 'true'
        run: |
          echo "::error title=Satelink health check::/health is DOWN (HTTP ${{ steps.probe.outputs.code }})"
          exit 1
